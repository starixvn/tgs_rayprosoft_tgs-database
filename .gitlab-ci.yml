variables:
  MigrationImageName: pgtgs/migration

stages:
  - build
  - test
  - publish
  - dbmigration-dev
  - dbmigration-staging
  - dbmigration-prod

build-code:
  stage: build
  script:
    - dotnet build -c $BuildConfiguration
  only:
    - merge_requests
    - main
  cache:
    key: Tgs.Database.$CI_PIPELINE_ID
    untracked: true

unit-test:
  stage: test
  script:
    - dotnet test -c $BuildConfiguration -l:"junit;LogFilePath=../TestReports/{assembly}-TestReport.xml" --no-restore
  needs:
    - job: build-code
  only:
    - merge_requests
    - main
  cache:
    key: Tgs.Database.$CI_PIPELINE_ID
    untracked: true
    policy: pull
  artifacts:
    reports:
      junit: ./TestReports/*-TestReport.xml

push-nuget:
  stage: publish
  needs:
    - job: build-code
    - unit-test
  only:
    - main
  cache:
    key: Tgs.Database.$CI_PIPELINE_ID
    untracked: true
    policy: pull
  script:
    - dotnet pack -c $BuildConfiguration "DataServices.Tgs/DataServices.Tgs.csproj"
    - dotnet nuget push "DataServices.Tgs/bin/$BuildConfiguration/*.nupkg" -s "raypro-baget" -k $NugetApiKey --skip-duplicate
  artifacts:
    name: Nuget
    untracked: false
    expire_in: "30 days"
    paths:
      - DataServices.Tgs/bin/$BuildConfiguration/*.nupkg

build-migrations-image:
  variables:
    BuildConfiguration: Release
  stage: publish
  needs:
    - unit-test
    - job: build-code
      artifacts: true
  cache:
    key: Tgs.Database.$CI_PIPELINE_ID
    untracked: true
    policy: pull
  script:
    - export Tag="$(date -d $CI_PIPELINE_CREATED_AT +%Y%m%d%H%M).$CI_PIPELINE_IID"
    #- dotnet build "MigrationEntry/MigrationEntry.csproj" -c $BuildConfiguration -t:ContainerBuild -p:DockerfileTag="$MigrationImageName:$Tag"
    #- docker build -t "$MigrationImageName:$Tag" --build-arg [BuildConfiguration]=$BuildConfiguration -f "MigrationEntry/Dockerfile" . --no-cache
    - dotnet publish "MigrationEntry/Dockerfile" --os linux  --arch x64 -c $BuildConfiguration -t:PublishContainer -p:DockerImageName="$MigrationImageName" -p:DockerImageTag="$Tag"
    - docker push $MigrationImageName:$Tag
  when: manual
  only:
    - main

push-migrations-k8s-template:
  stage: publish
  needs:
    - unit-test
    - build-migrations-image
  script:
    - export Tag="$(date -d $CI_PIPELINE_CREATED_AT +%Y%m%d%H%M).$CI_PIPELINE_IID"
    - mkdir -p artifacts/k8s
    - cp -R deployment/k8s/ef-migration artifacts/k8s/
    - |
      yq -i e '
        .image.repository = strenv(MigrationImageName) |
        .image.tag = strenv(Tag)
      ' artifacts/k8s/ef-migration/values.yaml
  only:
    - main
  artifacts:
    name: HelmTemplate
    untracked: false
    expire_in: "180 days"
    paths:
      - artifacts/**/*

migrate-dev:
  variables:
    namespace: dev
    GIT_STRATEGY: none
  environment:
    name: dbmigration-dev
  stage: dbmigration-dev
  needs:
    - build-migrations-image
    - job: push-migrations-k8s-template
      artifacts: true
  only:
    - main
  before_script:
    - export KUBECONFIG=$KubeConfig_Raypro_dev
  script:
    - export Tag="$(date -d $CI_PIPELINE_CREATED_AT +%Y%m%d%H%M).$CI_PIPELINE_IID"
    - export release_name="tgs-$Tag"
    - export resources=$(kubectl get cm resources-setting -o jsonpath={.data.ef-migration})
    - export dedicated=$(kubectl get cm tgs-settings -o jsonpath={.data.dedicated})
    - export node_selector=$(kubectl get cm tgs-settings -o jsonpath={.data.node-selector})
    - |
      cat << EOF | yq e -P | helm template artifacts/k8s/ef-migration \
        -n $namespace \
        --name-template $release_name \
        -f - 
      {
        "nodeSelector": $node_selector,
        "tolerations": [$dedicated],
        "resources": $resources
      }
      EOF
    - |
      cat << EOF | yq e -P | helm template artifacts/k8s/ef-migration \
        -n $namespace \
        --name-template $release_name \
        -f - \
        | kubectl -n $namespace apply -f -
      {
        "nodeSelector": $node_selector,
        "tolerations": [$dedicated],
        "resources": $resources
      }
      EOF

