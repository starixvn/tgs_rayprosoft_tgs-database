include:
  - project: rayprosoft/tgs-ci-scripts
    ref: main
    file: GitLab/Templates/gitlab-job-templates.yml

variables:
  MigrationImageName: pgtgs/migration
  BuildCacheKey: Tgs.Database.$CI_PIPELINE_IID

stages:
  - build
  - test
  - publish
  - dbmigration-dev
  - dbmigration-staging
  - dbmigration-prod

build-code:
  extends: .build-code-template

unit-test:
  extends: .unit-test-template
  artifacts:
    reports:
      junit: ./TestReports/*-TestReport.xml

push-nuget:
  extends: .push-nuget-template
  script:
    - push_package "DataServices.Tgs"
  artifacts:
    paths:
      - DataServices.Tgs/bin/$BuildConfiguration/*.nupkg

build-migrations-image:
  extends: .push-docker-image-template
  variables:
    BuildConfiguration: Release
  script:
    - docker build -t "$MigrationImageName:$Tag" --build-arg [BuildConfiguration]=$BuildConfiguration -f "MigrationEntry/Dockerfile" . --no-cache
    - docker push $MigrationImageName:$Tag
  when: manual
  only:
    - main

push-migrations-k8s-template:
  extends: .push-k8s-template
  needs:
    - unit-test
    - build-migrations-image
  script:
    - push_k8s_template 'ef-migration' $MigrationImageName $Tag

.migrate-deploy:
  extends: .deploy-template
  before_script:
    - !reference [.deploy-template, before_script]
    - |
      name_template="tgs-$Tag"
      function deploy_k8s() {
        local settingKey=$1
        local helmFolderName=$2
        local ns=$3
        local extendSettings=${4:-"$(</dev/stdin)"}

        local serviceResourceSetting=$(kubectl get cm resources-setting -o jsonpath={.data.${settingKey:=$TgsSettingKey}})
        local defaultResourceSetting=$(kubectl get cm resources-setting -o jsonpath={.data.default})
        local resources=$(echo $serviceResourceSetting $defaultResourceSetting | jq -s '.' | jq '.[0]')

        local dedicated=$(kubectl get cm tgs-settings -o jsonpath={.data.dedicated})
        
        local node_selector=$(kubectl get cm tgs-settings -o jsonpath={.data.node-selector})
        
        local serviceAutoScaling=$(kubectl get cm autoscaling-setting -o jsonpath={.data.${settingKey:=$TgsSettingKey}})
        local defaultAutoScaling=$(kubectl get cm autoscaling-setting -o jsonpath={.data.default})
        local autoscaling=$(echo $serviceAutoScaling $defaultAutoScaling | jq -s '.' | jq '.[0]')

        local valueConfig=$(
          cat << EOF
          {
            "replicaCount": $replica,
            "nodeSelector": $node_selector,
            "tolerations": [$dedicated],
            "resources": $resources,
            "autoscaling": $autoscaling
          }
      EOF
        )

        echo "$valueConfig" "$extendSettings" | jq -s 'reduce .[] as $item ({}; . * $item)' \
          | yq e -P | helm template artifacts/k8s/${helmFolderName:=$HelmTemplateFolderName} \
          -n ${ns:$namespace} \
          --name-template $name_template \
          -f - 

        echo "$valueConfig" "$extendSettings" | jq -s 'reduce .[] as $item ({}; . * $item)' \
          | yq e -P | helm template artifacts/k8s/${helmFolderName:=$HelmTemplateFolderName} \
          -n ${ns:$namespace} \
          --name-template $name_template \
          -f - \
          | kubectl -n ${ns:=$namespace} apply -f -
      }


migrate-dev:
  extends: .migrate-deploy
  variables:
    namespace: dev
    kube_config: KubeConfig_Raypro_dev
  environment:
    name: dbmigration-dev
  stage: dbmigration-dev
  needs:
    - build-migrations-image
    - job: push-migrations-k8s-template
      artifacts: true
  only:
    - main
  script:
    - deploy_k8s 'ef-migration' 'ef-migration' $namespace

migrate-staging:
  extends: .migrate-deploy
  variables:
    namespace: staging
    kube_config: KubeConfig_Raypro_staging
  environment:
    name: dbmigration-staging
  stage: dbmigration-staging
  needs:
    - migrate-dev
    - job: push-migrations-k8s-template
      artifacts: true
  when: manual
  only:
    - main
  script:
    - deploy_k8s 'ef-migration' 'ef-migration' $namespace

migrate-prod:
  extends: .migrate-deploy
  variables:
    namespace: prod
    kube_config: KubeConfig_Raypro_prod
  environment:
    name: dbmigration-prod
  stage: dbmigration-prod
  needs:
    - migrate-staging
    - job: push-migrations-k8s-template
      artifacts: true
  when: manual
  only:
    - main
  script:
    - deploy_k8s 'ef-migration' 'ef-migration' $namespace
